@if (trip(); as t) {
    <h1>{{ t.name }}</h1>

    <nav class="tabs">
        <a routerLink="info" routerLinkActive="active">Info</a>
        <a routerLink="weather" routerLinkActive="active">Weather</a>
    </nav>

    <router-outlet />
} @else {
    <h1>Trip not found</h1>
    <p>No trip with ID {{ id() }}.</p>
}

<a routerLink="/">← Back</a>
